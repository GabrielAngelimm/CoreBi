name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - run: ./tools/SecretScan.ps1
      - run: dotnet restore CoreBi.slnx --locked-mode
      - run: dotnet format whitespace CoreBi.slnx --no-restore --verify-no-changes
      - run: dotnet build CoreBi.slnx -c Release --no-restore
      - run: dotnet run --project tests/CoreBi.Tests -c Release --no-build -- artifacts/tests
      - run: ./tools/Publish.ps1
      - run: choco install innosetup --no-progress -y
      - run: ./tools/Installer.ps1 -SkipPublish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-preview
          path: |
            artifacts/tests/*.json
            artifacts/publish/win-x64/
            artifacts/installer/*.exe
          retention-days: 7
