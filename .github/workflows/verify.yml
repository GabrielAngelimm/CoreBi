name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  # No main cada merge gera o instalador: uma execução nova não cancela a anterior
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - run: ./tools/SecretScan.ps1
      - run: python -B tools/sync_theme.py --check
      - run: python -B tools/check_resources.py
      - run: dotnet restore CoreBi.slnx --locked-mode
      - run: dotnet format whitespace CoreBi.slnx --no-restore --verify-no-changes
      - run: dotnet build CoreBi.slnx -c Release --no-restore
      - run: dotnet run --project tests/CoreBi.Tests -c Release --no-build -- artifacts/tests
        timeout-minutes: 10
      # Depois do build e dos testes: um PR do Dependabot mostra se compila antes de parar na revisão de licença
      - run: python -B tools/collect_licenses.py --check
      - name: Tela de 1920 × 1080 para as capturas
        continue-on-error: true
        shell: pwsh
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force
      - name: Capturas das páginas (claro e escuro)
        id: shots
        continue-on-error: true
        timeout-minutes: 6
        run: dotnet run --project tests/CoreBi.Tests -c Release --no-build -- --shots artifacts/shots 6 "PageDash,PageSystem,PageSensors,PageGpu,PageDisks,PageEnergy,PageNet,PageOverlay,PageBottleneck,PageBench,PageStress,PageStartup,PageStartup:demo,PageApps,PageApps:pack,PageApps:confirm,PageApps:installing,PageApps:Jogos,PageDriver,PageDriver:demo,PageDriver:searching,PageDriver:backup,PageDriver:restore,PageDriver:backup-work,PageDriver:backup-done,PageDriver:restore-work,PageDriver:restore-done,PageDriver:gpu-confirm,PageDriver:wu-confirm" dark,light
      - if: steps.shots.outcome == 'failure'
        run: echo "::warning::As capturas falharam; veja o log do passo 'Capturas das páginas'"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        continue-on-error: true
        with:
          name: capturas
          path: artifacts/shots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - run: ./tools/Publish.ps1
      - run: choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y
      - run: ./tools/Installer.ps1 -SkipPublish
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows-preview
          path: |
            artifacts/tests/*.json
            artifacts/publish/win-x64/
            artifacts/installer/*.exe
          retention-days: 7
  # O push das capturas fica num job à parte: só ele tem permissão de escrita, nunca o que compila e roda código de terceiros
  capturas:
    needs: windows
    if: github.event_name == 'push' && startsWith(github.ref_name, 'feature/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: true
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publicar capturas no branch capturas/<branch>
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name capturas --dir capturas || exit 0
          ls capturas/*.png > /dev/null 2>&1 || exit 0
          cd capturas
          git init -q -b capturas
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -q -m "Capturas de $BRANCH ($GITHUB_SHA)"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.extraheader="AUTHORIZATION: basic $auth" push -q -f "https://github.com/$GITHUB_REPOSITORY.git" "capturas:refs/heads/capturas/$BRANCH"
