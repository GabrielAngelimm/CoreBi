name: Release
# Publica uma versão a partir da main: compila, testa e gera instalador, zip portátil, SHA256SUMS.txt e as notas (do
# CHANGELOG) numa máquina limpa, e só então cria a tag vX.Y.Z e a release com esses arquivos.
# Rodar em Actions > Release > Run workflow, com a versão do Directory.Build.props e a seção do CHANGELOG já datada.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão, igual à do Directory.Build.props (ex.: 1.0.0)'
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Versão pedida
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:VERSION -notmatch '^\d+\.\d+\.\d+$') { throw "Versão inválida: $env:VERSION" }
      - run: dotnet restore CoreBi.slnx --locked-mode
      - run: dotnet build CoreBi.slnx -c Release --no-restore
      - run: dotnet run --project tests/CoreBi.Tests -c Release --no-build -- artifacts/tests
        timeout-minutes: 10
      - run: python -B tools/collect_licenses.py --check
      - run: ./tools/Publish.ps1
      - run: choco install innosetup --version 6.7.1 --allow-downgrade --no-progress -y
      - run: ./tools/Installer.ps1 -SkipPublish
      - name: Arquivos da release
        env:
          VERSION: ${{ inputs.version }}
        run: python -B tools/release_assets.py $env:VERSION
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7
  # Só este job escreve no repositório, e ele não compila nem roda código: baixa os arquivos, confere e publica
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ github.sha }}
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name release --dir release
          cd release
          sha256sum --check SHA256SUMS.txt
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::A release v$VERSION já existe"
            exit 1
          fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$TARGET" \
            --title "CoreBi $VERSION" --notes-file release-notes.md --latest \
            "CoreBi-$VERSION-win-x64-setup.exe" "CoreBi-$VERSION-win-x64-portable.zip" SHA256SUMS.txt
